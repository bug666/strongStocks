name: Build volume-pivot screen

on:
  schedule:
    # 17:00 UTC, Mon-Fri = 12:00 noon US Central while Daylight Time is in effect (mid-Mar to early Nov).
    # After the Nov DST change this fires at 11:00 Central; change to "0 18 * * 1-5" then if you want noon year-round.
    # GitHub may start scheduled runs several minutes to ~30 min late under load.
    - cron: "0 17 * * 1-5"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab for on-demand rebuilds
  push:
    branches: [main]
    paths-ignore:           # don't loop on the bot's own archive commits
      - 'public/**'

permissions:
  contents: write          # commit the day's page + manifest back to the repo (this is the archive)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true    # a newer run supersedes an in-flight one; avoids two runs racing to push

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4      # restores public/ so previous days survive into the new deploy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pages and commit the archive
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ok=0
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"     # rebuild on top of the latest remote
            python build_screen.py public
            echo "----- public/ (attempt $attempt) -----"; ls -la public
            test "$(wc -c < public/index.html)" -ge 2000       # fail the run if the latest page is empty
            git add public
            if git diff --cached --quiet; then
              echo "no page changes"; ok=1; break
            fi
            git commit -q -m "screen $(date -u +%F)"
            if git push -q; then ok=1; break; fi
            echo "push rejected (attempt $attempt) - remote moved, retrying"
            sleep $(( (RANDOM % 6) + 3 ))
          done
          [ "$ok" = 1 ] || { echo "could not push the archive after retries" >&2; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
